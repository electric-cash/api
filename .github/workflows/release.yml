name: "Release"

on:
  push:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: api-image-publication
  cancel-in-progress: false

env:
  ECR_REPOSITORY: api
  IMAGE_TAG: ${{ github.sha }}
  BUILD_NAME: elcash-api-build-${{ github.run_id }}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build application image
        run: |
          docker build --label "org.opencontainers.image.revision=$IMAGE_TAG" -t "$BUILD_NAME" .
          docker run --rm --network none --entrypoint python "$BUILD_NAME" -m pip check

      - name: Authenticate production registry with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::628422242680:role/github-actions-api-publisher
          allowed-account-ids: "628422242680"
          audience: sts.amazonaws.com
          aws-region: eu-west-1
          role-duration-seconds: 900
          role-session-name: api-release-${{ github.run_id }}
          unset-current-credentials: true
          retry-max-attempts: 3

      - name: Login to Amazon ECR
        id: login-ecr-prod
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ecr-prod

      - name: Authenticate staging registry with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::869187294824:role/github-actions-api-publisher
          allowed-account-ids: "869187294824"
          audience: sts.amazonaws.com
          aws-region: eu-west-1
          role-duration-seconds: 900
          role-session-name: api-release-${{ github.run_id }}
          unset-current-credentials: true
          retry-max-attempts: 3

      - name: Login to Amazon ECR
        id: login-ecr-stage
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/ecr-stage

      - name: Publish to production registry
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-prod.outputs.registry }}
          DOCKER_CONFIG: ${{ runner.temp }}/ecr-prod
        run: bash .github/scripts/publish-image.sh

      - name: Publish to staging registry
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-stage.outputs.registry }}
          DOCKER_CONFIG: ${{ runner.temp }}/ecr-stage
        run: bash .github/scripts/publish-image.sh
